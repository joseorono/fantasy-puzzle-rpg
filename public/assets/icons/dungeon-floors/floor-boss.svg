<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>Boss floor</title>
  <!-- Horned war-helm, drawn pixel-by-pixel on a 16x16 grid. The horns break the
       outline at the top, which is what keeps it legible at ~17px where a skull
       collapses into mush. Layer order: dark silhouette, helm, horns, bevel,
       visor slit. -->
  <g fill="#2a1008">
    <rect x="1" y="1" width="3" height="1" />
    <rect x="12" y="1" width="3" height="1" />
    <rect x="1" y="2" width="4" height="1" />
    <rect x="11" y="2" width="4" height="1" />
    <rect x="1" y="3" width="14" height="5" />
    <rect x="2" y="8" width="12" height="3" />
    <rect x="3" y="11" width="10" height="1" />
    <rect x="4" y="12" width="8" height="1" />
    <rect x="5" y="13" width="6" height="1" />
  </g>
  <g fill="#c0563e">
    <rect x="6" y="4" width="4" height="1" />
    <rect x="2" y="5" width="12" height="2" />
    <rect x="3" y="7" width="10" height="3" />
    <rect x="4" y="10" width="8" height="1" />
    <rect x="5" y="11" width="6" height="1" />
    <rect x="6" y="12" width="4" height="1" />
  </g>
  <g fill="#e8d5a8">
    <rect x="2" y="2" width="1" height="1" />
    <rect x="13" y="2" width="1" height="1" />
    <rect x="2" y="3" width="2" height="1" />
    <rect x="12" y="3" width="2" height="1" />
    <rect x="2" y="4" width="2" height="1" />
    <rect x="12" y="4" width="2" height="1" />
  </g>
  <g fill="#b09a66">
    <rect x="2" y="4" width="2" height="1" />
    <rect x="12" y="4" width="2" height="1" />
  </g>
  <g fill="#e89273">
    <rect x="6" y="4" width="4" height="1" />
    <rect x="2" y="5" width="12" height="1" />
  </g>
  <g fill="#7a2e1e">
    <rect x="5" y="11" width="6" height="1" />
    <rect x="6" y="12" width="4" height="1" />
  </g>
  <rect x="6" y="8" width="4" height="1" fill="#2a1008" />
</svg>
